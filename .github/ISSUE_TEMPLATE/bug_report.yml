name: Bug report
description: Something doesn't work the way it should
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran, in order. Include the scanner/connector you targeted.
      placeholder: |
        aegis scan -t https://api.openai.com/v1/chat/completions -p openai -s llm01_prompt_injection
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected vs what you saw.
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: aegis version
      description: Output of `aegis --version`.
      render: shell
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: '3.11.7 / 3.12.2'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: 'Ubuntu 24.04 / macOS 14.5 / Windows 11'
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I've searched existing issues
          required: true
        - label: I'm running on a target I have authorization to test
          required: true
